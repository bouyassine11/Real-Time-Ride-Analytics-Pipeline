
services:

  # --------------------------------------------------------------------------
  # Redpanda — Kafka-compatible broker
  # --------------------------------------------------------------------------

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk topic list --brokers localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - ride-analytics-net

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # PostgreSQL — stores aggregated KPIs, read by Grafana
  # --------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB:       rideanalytics
      POSTGRES_USER:     spark
      POSTGRES_PASSWORD: spark
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d rideanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # Phase 1 — Ride event producer
  # --------------------------------------------------------------------------

  producer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ride-producer
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC_RIDE_EVENTS: ride_events
      KAFKA_TOPIC_DLQ: ride_events_dlq
      PRODUCER_EVENTS_PER_SECOND: "5"
      PRODUCER_MAX_EVENTS: "0"
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    restart: on-failure
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # Phase 2 — PySpark Structured Streaming → PostgreSQL
  # --------------------------------------------------------------------------

  spark:
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: spark-processor
    user: root
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC_RIDE_EVENTS: ride_events
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: rideanalytics
      PG_USER: spark
      PG_PASSWORD: spark
      SPARK_TRIGGER_INTERVAL: "30 seconds"
      SPARK_WINDOW_DURATION: "1 minute"
      SPARK_WATERMARK_DELAY: "2 minutes"
    volumes:
      - ..:/app
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.sql.shuffle.partitions=4
      /app/spark/streaming_processor.py
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # Phase 3 — Streamlit dashboard (reads directly from PostgreSQL)
  # --------------------------------------------------------------------------

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: ride-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      PG_HOST:     postgres
      PG_PORT:     "5432"
      PG_DATABASE: rideanalytics
      PG_USER:     spark
      PG_PASSWORD: spark
    restart: on-failure
    networks:
      - ride-analytics-net


# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------

volumes:
  postgres-data:
    driver: local

networks:
  ride-analytics-net:
    name: ride-analytics-net
