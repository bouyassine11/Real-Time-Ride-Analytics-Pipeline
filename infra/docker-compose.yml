version: "3.8"

# ---------------------------------------------------------------------------
# Shared Spark environment injected into every spark-* service
# ---------------------------------------------------------------------------
x-spark-common: &spark-common
  image: bitnami/spark:3.5.1
  environment:
    SPARK_MODE: client
    PYTHONPATH: /app
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    DELTA_BASE_PATH: /app/delta_data
    SPARK_TRIGGER_INTERVAL: "10 seconds"
    SPARK_WINDOW_DURATION: "1 minute"
    SPARK_WATERMARK_DELAY: "2 minutes"
    # Download Kafka + Delta connectors at submit time
    SPARK_SUBMIT_OPTIONS: >-
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.1.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
  volumes:
    # Mount the whole project into /app so all modules are importable
    - ..:/app
    # Persist Delta Lake data across container restarts
    - delta-data:/app/delta_data
  depends_on:
    kafka:
      condition: service_healthy
  networks:
    - ride-analytics-net


services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ride-analytics-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ride-analytics-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ride-analytics-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ride_events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ride_events_dlq --partitions 1 --replication-factor 1
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # Phase 1 — Ride event producer
  # --------------------------------------------------------------------------

  producer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ride-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RIDE_EVENTS: ride_events
      KAFKA_TOPIC_DLQ: ride_events_dlq
      PRODUCER_EVENTS_PER_SECOND: "10"
      PRODUCER_MAX_EVENTS: "0"
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    restart: on-failure
    networks:
      - ride-analytics-net

  # --------------------------------------------------------------------------
  # Phase 2 — Spark Structured Streaming jobs
  # Each job is a separate service so they can be started/stopped independently
  # --------------------------------------------------------------------------

  spark-bronze:
    <<: *spark-common
    container_name: spark-bronze
    command: >
      bash -c "pip install delta-spark==3.1.0 --quiet &&
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.1.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.shuffle.partitions=4
      /app/spark/bronze_ingestion.py"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  spark-silver:
    <<: *spark-common
    container_name: spark-silver
    command: >
      bash -c "pip install delta-spark==3.1.0 --quiet &&
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.1.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.shuffle.partitions=4
      /app/spark/silver_transform.py"
    depends_on:
      spark-bronze:
        condition: service_started
    restart: on-failure

  spark-gold:
    <<: *spark-common
    container_name: spark-gold
    command: >
      bash -c "pip install delta-spark==3.1.0 --quiet &&
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,io.delta:delta-spark_2.12:3.1.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.shuffle.partitions=4
      /app/spark/gold_aggregations.py"
    depends_on:
      spark-silver:
        condition: service_started
    restart: on-failure


# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------

volumes:
  delta-data:
    driver: local

networks:
  ride-analytics-net:
    name: ride-analytics-net
