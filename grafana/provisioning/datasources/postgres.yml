apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: ride-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: rideanalytics
    user: grafana
    secureJsonData:
      password: grafana
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true
